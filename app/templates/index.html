<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next Scroll</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tarekraafat/autocomplete.js@10.2.7/dist/autoComplete.min.js"></script>

</head>

<body>
  <div class="header">
    <div class="header-content">
      <div class="search-wrapper">
        <div class="search-bar">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.35-4.35"></path>
          </svg>
          <input type="text" class="search-input" id="searchInput" placeholder="Search by title...">
        </div>
      </div>
      <div class="modes">
        <button class="lantern active" data-mode="balanced" aria-label="Balanced mode">
          <img class="lantern-icon" src="../static/images/lantern.svg" alt="lantern image">
          <span class="lantern-label">Balanced</span>
        </button>

        <button class="lantern" data-mode="familiar" aria-label="Familiar mode">
          <img class="lantern-icon" src="../static/images/lantern.svg" alt="lantern image">
          <span class="lantern-label">Familiar</span>
        </button>

        <button class="lantern" data-mode="adventurous" aria-label="Adventurous mode">
          <img class="lantern-icon" src="../static/images/lantern.svg" alt="lantern image">
          <span class="lantern-label">Adventurous</span>
        </button>
      </div>
    </div>
  </div>

  <div class="bookshelf-wrapper">
    <div class="bookshelf-box">
      <div class="bookshelf-inner" id="bookshelfContainer">
        <div class="loading">
          <div class="spinner"></div>
          Loading books...
        </div>
      </div>
    </div>
  </div>

  <div id="bookOverlay" class="book-overlay">
    <div class="open-book">

      <div class="page left-page" id="leftPage"></div>
      <div class="page right-page" id="rightPage"></div>

    </div>
  </div>
  <script>
    let currentBooks = [];
    document.addEventListener("DOMContentLoaded", () => {
      fetch("/books?n=10")
        .then(res => res.json())
        .then(data => {
          currentBooks = data;
          renderBooks(data, false);
        })
        .catch(() => {
          document.getElementById("bookshelfContainer").innerHTML =
            "<div class='error'>Failed to load books</div>";
        });
      initializeLanternModes();
    });


    const autoCompleteJS = new autoComplete({
      selector: "#searchInput",
      placeHolder: "Search by title...",
      threshold: 1,
      debounce: 300,
      data: {
        src: async (query) => {
          try {
            const response = await fetch(`/search?q=${encodeURIComponent(query)}`);
            const data = await response.json();
            return data.map(book => ({ id: book.id, title: book.title }));
          } catch (error) {
            console.error(error);
            return [];
          }
        },
        cache: false,
        keys: ["title"]
      },
      resultsList: {
        tag: "ul",
        id: "autoComplete_list",
        class: "search-suggestions",
        element: (list, data) => {
          if (!data.results.length) {
            const message = document.createElement("div");
            message.className = "no-results";
            message.innerHTML = `No results for "${data.query}"`;
            list.prepend(message);
          }
        }
      },
      resultItem: {
        element: (item, data) => {
          item.innerHTML = `<div class="suggestion-item">${data.match}</div>`;
        }
      },
      events: {
        input: {
          selection: (event) => {
            const selection = event.detail.selection.value;
            document.querySelector("#searchInput").value = selection.title;
            window.autoCompleteJustSelected = true;
            fetchRecommendations(selection.id, selection.title)
            setTimeout(() => {
              window.autoCompleteJustSelected = false;
            }, 30);
          }
        },
      }
    });

    document.getElementById('searchInput').addEventListener('keydown', (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        if (window.autoCompleteJustSelected) {
          return;
        }
        const firstResult = autoCompleteJS.feedback?.results[0]?.value;
        const title = event.target.value.trim();
        if (title) {
          autoCompleteJS.close();
          event.target.blur();
          id = firstResult ? firstResult.id : null;
          fetchRecommendations(id, title);
        }
      }
    });

    function initializeLanternModes() {
      const lanterns = document.querySelectorAll('.lantern');
      let currentMode = 'balanced';
      let lastSearchedBook = null;

      lanterns.forEach(lantern => {
        lantern.addEventListener('click', () => {
          lanterns.forEach(l => l.classList.remove('active'));

          lantern.classList.add('active');

          currentMode = lantern.getAttribute('data-mode');

          console.log('Mode changed to:', currentMode);

          updateRecommendationMode(currentMode);

          if (lastSearchedBook) {
            fetchRecommendations(lastSearchedBook.id, lastSearchedBook.title);
          }
        });
      });

      window.setLastSearchedBook = function (id, title) {
        lastSearchedBook = { id, title };
      };
    }

    function updateRecommendationMode(mode) {
      window.currentRecommendationMode = mode;
      sessionStorage.setItem('recommendationMode', mode);
    }

    let resizeTimer;
    window.addEventListener("resize", () => {
      clearTimeout(resizeTimer);

      resizeTimer = setTimeout(() => {
        renderBooks(currentBooks);
      }, 200);
    });

    function getBooksPerShelf() {
      if (window.innerWidth < 480) return 2;
      if (window.innerWidth < 768) return 3;
      return 5;
    }

    function renderBooks(books, isRecommendation = true) {
      const container = document.getElementById('bookshelfContainer');

      if (books.length === 0) {
        container.innerHTML = '<div class="no-results">No books found</div>';
        return;
      }

      const booksPerShelf = getBooksPerShelf();
      const shelves = [];

      for (let i = 0; i < books.length; i += booksPerShelf) {
        shelves.push(books.slice(i, i + booksPerShelf));
      }

      container.innerHTML = shelves.map(shelf => `
                <div class="shelf-unit">
                    <div class="books-container">
                        ${shelf.map(book => `
                            <div class="book" 
                                 onclick="toggleBook(this,${isRecommendation})"
                                 data-title="${book.title}"
                                 data-description="${book.description}"
                                 data-link="${book.link}"
                                 data-genre="${book.genres}"
                                 data-tags="${book.tags}">
                                <div class="book-cover">
                                      <div class="book-title-overlay">${book.title}</div>
                                      <img src="../static/images/book_cover.png" alt="${book.title}"></img>
                                </div>
                                <div class="book-tooltip">
                                    <div class="tooltip-title">${book.title}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
    }

    async function fetchRecommendations(id, title) {
      console.log('Fetching recommendations for:', id, title);

      const mode = window.currentRecommendationMode ||
        sessionStorage.getItem('recommendationMode') ||
        'balanced';

      try {
        const response = await fetch("/recommendations", {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            id,
            title,
            mode: mode,
            top_n: 20,
            min_similarity: 0.2
          })
        });
        if (!response.ok) {
          throw new Error(`HTTP error: ${response.status}`);
        }
        const data = await response.json();
        currentBooks = data.recommendations;
        renderBooks(data.recommendations);

        if (window.setLastSearchedBook) {
          window.setLastSearchedBook(id, title);
        }
      }
      catch (error) {
        console.error('Recommendation error:', error);
        document.getElementById('bookshelfContainer').innerHTML =
          '<div class="error">Failed to load recommendations</div>';
      }
    }

    function toggleBook(bookElement, isRecommendation) {
      const label = isRecommendation ? "Shared Tropes" : "Tags"

      const overlay = document.getElementById("bookOverlay");
      const left = document.getElementById("leftPage");
      const right = document.getElementById("rightPage");

      const title = bookElement.querySelector(".book-title-overlay").innerText;
      const description = bookElement.getAttribute("data-description");
      const link = bookElement.getAttribute("data-link");
      const genre = bookElement.getAttribute("data-genre").replace(/,/g, ", ");;
      const tags = bookElement.getAttribute("data-tags").replace(/,/g, ", ");;

      left.innerHTML = `
        <h2 class="introduction">
            <a href="${link}" target="_blank">${title}</a>
            <p class="introduction meta">Genre: ${genre}</p>
            <p class="introduction meta">${label}: ${tags}</p>
        </h2>
      `;

      right.innerHTML = `
        ${chunkTextRandom(description)
          .map(p => `<p class="introduction">${p}</p>`)
          .join("")}
      `;

      overlay.classList.add("active");
      document.body.classList.add("lock-scroll");
      document.body.style.overflow = "hidden";
    }
    const overlay = document.getElementById("bookOverlay");

    overlay.addEventListener("click", (e) => {

      if (e.target !== overlay) return;

      overlay.classList.remove("active");
      document.body.classList.remove("lock-scroll");

      document.body.style.overflow = "";
    });

    function chunkTextRandom(text, min = 5, max = 12) {
      const sentenceRegex = /[^.!?]+[.!?](?=(?:["”']?\s)|$)/g;
      const sentences = text.match(sentenceRegex) || [text];
      const paragraphs = [];

      let i = 0;
      while (i < sentences.length) {
        const count =
          Math.floor(Math.random() * (max - min + 1)) + min;

        paragraphs.push(
          sentences.slice(i, i + count).join(" ").trim()
        );
        i += count;
      }
      return paragraphs;
    }
  </script>
</body>

</html>
